name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pages-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve deploy paths
        id: paths
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base_path=/social-impact/pr-preview/pr-${{ github.event.number }}/" >> "$GITHUB_OUTPUT"
            echo "destination_dir=pr-preview/pr-${{ github.event.number }}" >> "$GITHUB_OUTPUT"
            echo "preview_url=https://${{ github.repository_owner }}.github.io/social-impact/pr-preview/pr-${{ github.event.number }}/" >> "$GITHUB_OUTPUT"
          else
            echo "base_path=/social-impact/" >> "$GITHUB_OUTPUT"
            echo "destination_dir=." >> "$GITHUB_OUTPUT"
            echo "preview_url=https://${{ github.repository_owner }}.github.io/social-impact/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: pnpm build
        env:
          VITE_BASE_PATH: ${{ steps.paths.outputs.base_path }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_APPS_SCRIPT_URL: ${{ vars.VITE_APPS_SCRIPT_URL }}

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          destination_dir: ${{ steps.paths.outputs.destination_dir }}
          keep_files: true

      - name: Comment PR preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- social-impact-preview-url -->';
            const body = `${marker}\nPreview URL: ${{ steps.paths.outputs.preview_url }}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.data.find((comment) => comment.user.type === 'Bot' && comment.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  cleanup-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Remove preview
        run: |
          cd gh-pages
          rm -rf "pr-preview/pr-${{ github.event.number }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove PR ${{ github.event.number }} preview" || exit 0
          git push
